services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: artistcollage
      POSTGRES_USER: artistcollage
      POSTGRES_PASSWORD: artistcollage
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artistcollage -d artistcollage"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
